<!doctype html>
<html lang="ru">
  <head>
    {% include head.html %}
  </head>
  <body class="document-page">
    <a class="skip-link" href="#content">Перейти к содержанию</a>
    {% include header.html %}
    <main id="content" class="shell document-shell">
      <nav class="breadcrumbs" aria-label="Хлебные крошки">
        <a href="{{ '/' | relative_url }}">Приложения</a>
        <span aria-hidden="true">/</span>
        <a href="{{ '/apps/' | append: page.app_slug | append: '/' | relative_url }}">{{ page.app_title }}</a>
      </nav>
      <header class="document-header">
        <p class="eyebrow">{{ page.kicker | default: page.app_title }}</p>
        <h1>{{ page.title }}</h1>
        {% if page.updated %}<p class="updated">Дата редакции: {{ page.updated }}</p>{% endif %}
      </header>
      <article class="document-content">
        {{ content }}
      </article>
    </main>
    {% include footer.html %}
  </body>
</html>
