<article class="app-card">
  <a class="app-card-visual" href="{{ include.app.url | relative_url }}" tabindex="-1" aria-hidden="true">
    <img src="{{ include.app.icon | relative_url }}" alt="" width="512" height="512" loading="lazy">
  </a>
  <div class="app-card-body">
    <p class="eyebrow">{{ include.app.platform }}</p>
    <h2><a href="{{ include.app.url | relative_url }}">{{ include.app.title }}</a></h2>
    <p>{{ include.app.description }}</p>
    <div class="chip-row" aria-label="Основные характеристики">
      <span class="chip">{{ include.app.min_android }}</span>
      <span class="chip">Без регистрации</span>
    </div>
    <a class="text-link" href="{{ include.app.url | relative_url }}">О приложении <span aria-hidden="true">→</span></a>
  </div>
</article>
