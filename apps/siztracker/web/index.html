<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SIZ Tracker</title>
  <meta name="description" content="Учет средств индивидуальной защиты (СИЗ)">
  <meta name="theme-color" content="#2c3e50">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIZ Tracker">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Шапка (аналог ActionBar) -->
  <header id="appbar">
    <img id="appLogo" src="icons/icon-192.png" alt="logo">
    <div class="appbar-titles">
      <div id="appTitle" class="appbar-title">SIZ Tracker</div>
      <div id="appSubtitle" class="appbar-subtitle">Учет СИЗ</div>
    </div>
    <button id="btnSearch" class="icon-btn" aria-label="search" title="">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    </button>
    <button id="btnMenu" class="icon-btn" aria-label="menu" title="">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </button>
  </header>

  <!-- Выпадающее меню ⋮ -->
  <div id="menuPopup" class="popup hidden"></div>
  <!-- Контекстное меню элемента -->
  <div id="contextMenu" class="popup hidden"></div>

  <main id="main">
    <button id="btnAdd" class="btn btn-pill">ДОБАВИТЬ</button>

    <div class="btn-row">
      <button id="btnExit" class="btn btn-blue">ВЫХОД</button>
      <button id="btnCheck" class="btn btn-green">ПРОВЕРИТЬ</button>
    </div>

    <div id="searchWrap" class="hidden">
      <input id="searchInput" type="search" autocomplete="off">
    </div>

    <div id="stats">Всего: 0 | Внимание: 0 | Сдано: 0</div>

    <div id="empty" class="hidden"></div>

    <ul id="list"></ul>
  </main>

  <!-- Полноэкранное оповещение (аналог AlertActivity) -->
  <div id="alertScreen" class="hidden">
    <div class="alert-card">
      <div class="alert-head">
        <img src="icons/icon-192.png" alt="">
        <div>
          <div id="alertTitle" class="alert-title">ВНИМАНИЕ!</div>
          <div id="alertSubtitle" class="alert-subtitle"></div>
        </div>
        <button id="alertSoundBtn" class="icon-btn dark" title="sound">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
        </button>
      </div>
      <div class="alert-body">
        <img id="alertImg" src="icons/icon-192.png" alt="">
        <div id="alertName"></div>
        <div id="alertNumber"></div>
        <div id="alertDays"></div>
        <hr>
        <div id="alertProgress"></div>
      </div>
      <div class="alert-btns">
        <button id="btnSubmitted" class="alert-btn green"></button>
        <button id="btnNotSubmitted" class="alert-btn red"></button>
      </div>
    </div>
    <div id="alertNote"></div>
  </div>

  <!-- Корневой контейнер модальных окон -->
  <div id="modalRoot"></div>

  <!-- Тосты -->
  <div id="toast" class="hidden"></div>

  <!-- Скрытый input для импорта файла -->
  <input type="file" id="importFile" accept=".json,.txt,application/json,text/plain" hidden>

  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/db.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
